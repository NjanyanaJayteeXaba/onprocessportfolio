[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://kit.fontawesome.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https: https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com https://ka-f.fontawesome.com https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: https://www.gstatic.com/recaptcha/; connect-src 'self' https://generativelanguage.googleapis.com https://www.google.com/recaptcha/ https://ka-f.fontawesome.com;"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
